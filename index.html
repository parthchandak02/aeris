<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aeris - World Weather</title>
  <script src="https://cdn.jsdelivr.net/npm/animejs@4.0.2/lib/anime.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e8f4f8;
      --card: rgba(255,255,255,0.35);
      --card-border: rgba(255,255,255,0.5);
      --accent1: #81d4fa;
      --accent2: #ce93d8;
      --accent3: #f48fb1;
      --accent4: #fff176;
      --text: rgba(0,0,0,0.7);
      --text-muted: rgba(0,0,0,0.4);
      --warm: #ff8a65;
      --cool: #4fc3f7;
      --entrance: 360ms cubic-bezier(0.16, 1, 0.3, 1);
      --feedback: 160ms cubic-bezier(0.16, 1, 0.3, 1);
      --ambient: 2400ms ease-in-out;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(129,212,250,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(206,147,216,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 50% 35% at 50% 90%, rgba(244,143,177,0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Hero Number */
    #hero {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
    }

    #hero-temp {
      font-size: 56px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--text);
    }

    #hero-city {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    /* Ticker */
    #ticker-wrap {
      position: fixed;
      top: 100px;
      left: 0;
      right: 0;
      z-index: 5;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    #ticker {
      display: flex;
      gap: 48px;
      white-space: nowrap;
      padding: 8px 0;
      animation: ticker-scroll 40s linear infinite;
    }

    #ticker span {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    @keyframes ticker-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Main grid */
    #grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 180px 20px 200px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      #grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 900px) {
      #grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 1100px) {
      #grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* Cards */
    .card {
      position: relative;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: var(--card);
      padding: 24px 20px 20px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(100px);
      transition:
        transform var(--feedback),
        box-shadow var(--feedback),
        border-color var(--feedback);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(129,212,250,0.25);
    }

    .card.tapped {
      border-color: var(--accent1);
      box-shadow: 0 0 0 2px rgba(129,212,250,0.4), 0 8px 32px rgba(129,212,250,0.2);
    }

    .card.hint-pulse {
      animation: card-hint var(--ambient) ease-in-out infinite;
    }

    @keyframes card-hint {
      0%, 100% { box-shadow: 0 4px 20px rgba(129,212,250,0.15); }
      50% { box-shadow: 0 4px 28px rgba(129,212,250,0.35); }
    }

    .card-city {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-temp {
      font-size: 36px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .card-temp.pulse {
      animation: temp-breathe 2400ms ease-in-out infinite;
    }

    @keyframes temp-breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }

    .card-weather {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .card-emoji { font-size: 20px; }

    .card-metrics {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .metric-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .metric-label {
      width: 28px;
      flex-shrink: 0;
    }

    .humidity-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent1);
      flex-shrink: 0;
    }

    .wind-track {
      flex: 1;
      height: 3px;
      background: rgba(0,0,0,0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .wind-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      border-radius: 2px;
      transition: width var(--feedback);
    }

    /* Quiet Zone */
    #quiet-zone {
      position: fixed;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      z-index: 100;
      width: 320px;
      max-width: calc(100vw - 32px);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.55);
      border: 0.5px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 360ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #quiet-zone.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    #quiet-zone h3 {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    #quiet-zone .qz-emoji {
      font-size: 28px;
      margin-bottom: 12px;
    }

    #quiet-zone .qz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      font-size: 12px;
    }

    #quiet-zone .qz-label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #quiet-zone .qz-value {
      font-size: 14px;
      font-weight: 400;
    }

    #quiet-zone .qz-source {
      margin-top: 14px;
      font-size: 10px;
      color: var(--text-muted);
    }

    #quiet-zone .qz-source a {
      color: var(--accent1);
      text-decoration: none;
    }

    /* Chrome: stamp, legend, desc */
    #stamp {
      position: fixed;
      bottom: 20px;
      left: 16px;
      z-index: 10;
      font-size: 10px;
      font-family: system-ui, sans-serif;
      opacity: 0.4;
      color: var(--text);
    }

    #legend {
      position: fixed;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 10px;
      font-family: system-ui, sans-serif;
      opacity: 0.35;
      color: var(--text);
      white-space: nowrap;
    }

    #desc {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 11px;
      font-family: system-ui, sans-serif;
      opacity: 0.45;
      color: var(--text);
      text-align: center;
      max-width: 65ch;
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <div id="hero">
    <div id="hero-temp">--</div>
    <div id="hero-city">Loading...</div>
  </div>

  <div id="ticker-wrap">
    <div id="ticker"></div>
  </div>

  <main id="grid"></main>

  <div id="quiet-zone" role="dialog" aria-label="Weather details">
    <h3 id="qz-city"></h3>
    <div class="qz-emoji" id="qz-emoji"></div>
    <div class="qz-grid" id="qz-grid"></div>
    <div class="qz-source">Data: <a href="https://open-meteo.com" target="_blank" rel="noopener">open-meteo.com</a></div>
  </div>

  <div id="stamp">Open-Meteo · 12 cities · loading...</div>
  <div id="legend">&#9728;&#65039; clear &nbsp; &#9925; cloudy &nbsp; &#127783;&#65039; rain &nbsp; &#10052;&#65039; snow</div>
  <div id="desc">Scroll to explore weather across 12 cities · Tap a card for details</div>

  <script>
    const C = {
      palette: {
        bg: '#e8f4f8',
        card: 'rgba(255,255,255,0.35)',
        cardBorder: 'rgba(255,255,255,0.5)',
        accent1: '#81d4fa',
        accent2: '#ce93d8',
        accent3: '#f48fb1',
        accent4: '#fff176',
        text: 'rgba(0,0,0,0.7)',
        textMuted: 'rgba(0,0,0,0.4)',
        warm: '#ff8a65',
        cool: '#4fc3f7',
      },
      cities: [
        { name: 'San Francisco', lat: 37.77, lng: -122.42 },
        { name: 'New York', lat: 40.71, lng: -74.01 },
        { name: 'London', lat: 51.51, lng: -0.13 },
        { name: 'Tokyo', lat: 35.68, lng: 139.69 },
        { name: 'Sydney', lat: -33.87, lng: 151.21 },
        { name: 'Mumbai', lat: 19.08, lng: 72.88 },
        { name: 'Dubai', lat: 25.20, lng: 55.27 },
        { name: 'Singapore', lat: 1.35, lng: 103.82 },
        { name: 'Paris', lat: 48.86, lng: 2.35 },
        { name: 'Berlin', lat: 52.52, lng: 13.41 },
        { name: 'Toronto', lat: 43.65, lng: -79.38 },
        { name: 'Sao Paulo', lat: -23.55, lng: -46.63 },
      ],
      motion: {
        entrance: 360,
        feedback: 160,
        ambient: 2400,
        stagger: 80,
      },
      quietZoneIdle: 4000,
      refreshInterval: 10 * 60 * 1000,
      tempRange: { min: -5, max: 45 },
      windRange: { min: 0, max: 60, barMax: 80 },
      humidityRange: { min: 0, max: 100, opacityMin: 0.2, opacityMax: 1.0 },
      fallbackTemps: [22, 24, 21, 23, 20, 25, 28, 27, 22, 21, 19, 24],
    };

    const WEATHER_CODES = [
      { max: 0, emoji: '\u2600\uFE0F', label: 'Clear' },
      { max: 3, emoji: '\u26C5', label: 'Partly cloudy' },
      { max: 48, emoji: '\u2601\uFE0F', label: 'Foggy' },
      { max: 67, emoji: '\uD83C\uDF27\uFE0F', label: 'Rain' },
      { max: 77, emoji: '\u2744\uFE0F', label: 'Snow' },
      { max: 82, emoji: '\uD83C\uDF26\uFE0F', label: 'Showers' },
      { max: 86, emoji: '\uD83C\uDF28\uFE0F', label: 'Snow showers' },
      { max: 99, emoji: '\u26C8\uFE0F', label: 'Storm' },
    ];

    let weatherData = [];
    let isLive = false;
    let lastFetchTime = null;
    let quietZoneTimer = null;
    let touchMoved = false;
    let touchStartY = 0;
    let touchStartX = 0;

    function scale(val, inMin, inMax, outMin, outMax) {
      const t = Math.max(0, Math.min(1, (val - inMin) / (inMax - inMin)));
      return outMin + t * (outMax - outMin);
    }

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16),
      };
    }

    function lerpColor(c1, c2, t) {
      const a = hexToRgb(c1);
      const b = hexToRgb(c2);
      const r = Math.round(a.r + (b.r - a.r) * t);
      const g = Math.round(a.g + (b.g - a.g) * t);
      const bl = Math.round(a.b + (b.b - a.b) * t);
      return `rgba(${r},${g},${bl},0.18)`;
    }

    function tempTint(temp) {
      const t = scale(temp, C.tempRange.min, C.tempRange.max, 0, 1);
      return lerpColor(C.palette.cool, C.palette.warm, t);
    }

    function lookupWeather(code) {
      for (const w of WEATHER_CODES) {
        if (code <= w.max) return w;
      }
      return WEATHER_CODES[WEATHER_CODES.length - 1];
    }

    function buildFallback() {
      return C.cities.map((city, i) => ({
        city: city.name,
        lat: city.lat,
        lng: city.lng,
        temperature: C.fallbackTemps[i],
        apparent: C.fallbackTemps[i] - 1,
        humidity: 55 + (i % 5) * 8,
        wind: 8 + (i % 4) * 5,
        pressure: 1013 + (i % 3) * 2,
        precipitation: 0,
        weatherCode: 0,
      }));
    }

    async function fetchCity(city) {
      const params = new URLSearchParams({
        latitude: city.lat,
        longitude: city.lng,
        current: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,surface_pressure',
      });
      const url = `https://api.open-meteo.com/v1/forecast?${params}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      const cur = data.current;
      if (!cur || cur.temperature_2m == null || cur.weather_code == null) throw new Error('Missing current data');
      return {
        city: city.name,
        lat: city.lat,
        lng: city.lng,
        temperature: cur.temperature_2m,
        apparent: cur.apparent_temperature ?? cur.temperature_2m,
        humidity: cur.relative_humidity_2m,
        wind: cur.wind_speed_10m,
        pressure: cur.surface_pressure,
        precipitation: cur.precipitation ?? 0,
        weatherCode: cur.weather_code,
      };
    }

    async function loadWeather() {
      try {
        const results = await Promise.all(
          C.cities.map((city) => fetchCity(city))
        );
        weatherData = results;
        isLive = true;
        lastFetchTime = Date.now();
      } catch {
        // On a failed refresh keep the last live numbers (the stamp's age keeps counting);
        // only fall back to canned values when nothing live has loaded yet.
        if (!isLive) {
          weatherData = buildFallback();
          lastFetchTime = Date.now();
        }
      }
      renderAll();
    }

    function formatTemp(t) {
      return Math.round(t) + '\u00B0';
    }

    function renderCard(d, index) {
      const w = lookupWeather(d.weatherCode);
      const tint = tempTint(d.temperature);
      const humOpacity = scale(d.humidity, C.humidityRange.min, C.humidityRange.max, C.humidityRange.opacityMin, C.humidityRange.opacityMax);
      const windWidth = scale(d.wind, C.windRange.min, C.windRange.max, 0, C.windRange.barMax);

      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.index = index;
      card.style.background = `linear-gradient(135deg, ${tint}, rgba(255,255,255,0.25))`;

      card.innerHTML = `
        <div class="card-city">${d.city}</div>
        <div class="card-temp pulse">${formatTemp(d.temperature)}</div>
        <div class="card-weather">
          <span class="card-emoji">${w.emoji}</span>
          <span>${w.label}</span>
        </div>
        <div class="card-metrics">
          <div class="metric-row">
            <span class="metric-label">Hum</span>
            <span class="humidity-dot" style="opacity:${humOpacity.toFixed(2)}"></span>
            <span>${Math.round(d.humidity)}%</span>
          </div>
          <div class="metric-row">
            <span class="metric-label">Wind</span>
            <div class="wind-track">
              <div class="wind-bar" style="width:${windWidth.toFixed(0)}px"></div>
            </div>
            <span>${Math.round(d.wind)} km/h</span>
          </div>
        </div>
      `;

      bindCardEvents(card, index);
      return card;
    }

    function bindCardEvents(card, index) {
      card.addEventListener('touchstart', (e) => {
        touchMoved = false;
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      card.addEventListener('touchmove', (e) => {
        const dy = Math.abs(e.touches[0].clientY - touchStartY);
        const dx = Math.abs(e.touches[0].clientX - touchStartX);
        if (dy > 10 || dx > 10) touchMoved = true;
      }, { passive: true });

      card.addEventListener('touchend', () => {
        if (!touchMoved) openQuietZone(index);
      });

      card.addEventListener('click', (e) => {
        if (e.pointerType === 'touch') return;
        openQuietZone(index);
      });
    }

    function renderAll() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      weatherData.forEach((d, i) => grid.appendChild(renderCard(d, i)));

      updateHero(0);
      buildTicker();
      updateStamp();

      requestAnimationFrame(() => {
        initScrollAnimations();
        const first = grid.querySelector('.card');
        if (first) first.classList.add('hint-pulse');
      });
    }

    function updateHero(index) {
      const d = weatherData[index];
      if (!d) return;
      document.getElementById('hero-temp').textContent = formatTemp(d.temperature);
      document.getElementById('hero-city').textContent = d.city;
    }

    function buildTicker() {
      const ticker = document.getElementById('ticker');
      const items = weatherData.map(d => {
        const w = lookupWeather(d.weatherCode);
        return `<span>${d.city} ${formatTemp(d.temperature)} ${w.emoji} ${w.label.toLowerCase()} · wind ${Math.round(d.wind)} km/h</span>`;
      });
      const html = items.join('');
      ticker.innerHTML = html + html;
    }

    function updateStamp() {
      const stamp = document.getElementById('stamp');
      const mode = isLive ? 'live' : 'fallback';
      const ago = lastFetchTime ? Math.round((Date.now() - lastFetchTime) / 1000) : 0;
      stamp.textContent = `Open-Meteo \u00B7 12 cities \u00B7 ${mode} \u00B7 ${ago}s ago`;
    }

    function openQuietZone(index) {
      const d = weatherData[index];
      if (!d) return;
      const w = lookupWeather(d.weatherCode);

      const grid = document.getElementById('grid');
      grid.querySelectorAll('.card').forEach((c, i) => {
        c.classList.toggle('tapped', i === index);
        if (i === 0) c.classList.remove('hint-pulse');
      });

      document.getElementById('qz-city').textContent = d.city;
      document.getElementById('qz-emoji').textContent = w.emoji;
      document.getElementById('qz-grid').innerHTML = `
        <div><div class="qz-label">Temperature</div><div class="qz-value">${formatTemp(d.temperature)}</div></div>
        <div><div class="qz-label">Feels like</div><div class="qz-value">${formatTemp(d.apparent)}</div></div>
        <div><div class="qz-label">Humidity</div><div class="qz-value">${Math.round(d.humidity)}%</div></div>
        <div><div class="qz-label">Wind</div><div class="qz-value">${Math.round(d.wind)} km/h</div></div>
        <div><div class="qz-label">Pressure</div><div class="qz-value">${Math.round(d.pressure)} hPa</div></div>
        <div><div class="qz-label">Precipitation</div><div class="qz-value">${d.precipitation.toFixed(1)} mm</div></div>
      `;

      const qz = document.getElementById('quiet-zone');
      qz.classList.add('active');
      updateHero(index);

      clearTimeout(quietZoneTimer);
      quietZoneTimer = setTimeout(closeQuietZone, C.quietZoneIdle);
    }

    function closeQuietZone() {
      document.getElementById('quiet-zone').classList.remove('active');
      document.getElementById('grid').querySelectorAll('.card').forEach(c => c.classList.remove('tapped'));
      updateHero(0);
    }

    function initScrollAnimations() {
      const cards = document.querySelectorAll('.card');
      const observer = new IntersectionObserver((entries) => {
        const entering = entries.filter(e => e.isIntersecting && !e.target.classList.contains('animated'));
        if (!entering.length) return;

        const targets = entering.map(e => {
          e.target.classList.add('animated');
          return e.target;
        });

        if (typeof anime !== 'undefined') {
          anime({
            targets,
            translateY: [100, 0],
            opacity: [0, 1],
            duration: C.motion.entrance,
            easing: 'easeOutExpo',
            delay: anime.stagger(C.motion.stagger),
          });
        } else {
          targets.forEach(el => {
            el.classList.add('visible');
            el.style.transform = 'translateY(0)';
            el.style.opacity = '1';
          });
        }
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      cards.forEach(card => observer.observe(card));

      cards.forEach((card, i) => {
        if (i < 3) {
          card.classList.add('animated');
          if (typeof anime !== 'undefined') {
            anime({
              targets: card,
              translateY: [100, 0],
              opacity: [0, 1],
              duration: C.motion.entrance,
              easing: 'easeOutExpo',
              delay: i * C.motion.stagger,
            });
          } else {
            card.classList.add('visible');
          }
        }
      });
    }

    document.getElementById('quiet-zone').addEventListener('mousemove', () => {
      clearTimeout(quietZoneTimer);
      quietZoneTimer = setTimeout(closeQuietZone, C.quietZoneIdle);
    });

    document.getElementById('quiet-zone').addEventListener('touchstart', () => {
      clearTimeout(quietZoneTimer);
      quietZoneTimer = setTimeout(closeQuietZone, C.quietZoneIdle);
    }, { passive: true });

    setInterval(updateStamp, 1000);
    setInterval(() => {
      if (!document.getElementById('quiet-zone').classList.contains('active')) loadWeather();
    }, C.refreshInterval);
    loadWeather();
  </script>
</body>
